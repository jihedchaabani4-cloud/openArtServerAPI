id: movie-poster-v1
name: Movie Poster
version: 1.0.0
description: Generate a cinematic movie poster from a scene concept.

metadata:
  category: poster
  tags: [poster, key-art, marketing]
  author: system

input_schema:
  required: [prompt]
  properties:
    prompt: { type: string }
    characters: { type: array }
    references: { type: array }
    style: { type: string }

nodes:
  build_prompt:
    type: prompt-builder
    user_inputs:
      prompt: "${input.prompt}"
      characters: "${input.characters}"
      references: "${input.references}"
      style: "${input.style}"
    config:
      skills: [movie-poster]
      skill_parameters:
        aspect_ratio: "2:3"

  generate:
    type: image-generation
    depends_on: [build_prompt]
    inputs:
      prompt: "${build_prompt.output.finalPrompt}"
      references: "${build_prompt.output.context.references}"
    config:
      width: 1024
      height: 1536
      count: 1

outputs:
  main_asset: "${generate.output.assets}"

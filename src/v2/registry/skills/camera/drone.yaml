id: camera/drone
label: Aerial Drone Shot
category: camera
media_types: [video]
prompt_instruction: |
  Apply an aerial drone camera perspective and movement:
  - Bird's-eye view or elevated perspective looking down at the scene
  - Wide-angle lens capturing expansive environmental context and scale
  - Smooth, gliding motion characteristic of professional drone cinematography
  - Gentle sweeping arcs or forward tracking at altitude
  - Environmental details, landscape, and spatial scale are clearly visible

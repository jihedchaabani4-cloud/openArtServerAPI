id: brand-mascot-v1
name: Brand Mascot Ad Series
version: 1.0.0
description: Create a mascot character series for your brand

metadata:
  category: advertising
  tags: [brand, mascot, ads]
  author: system

input_schema:
  required: [prompt, mascot_style]
  properties:
    prompt: { type: string }
    mascot_style: { type: string }
    count: { type: number }
    model: { type: string }
    aspect_ratio: { type: string }
    ratio: { type: string }
    width: { type: number }
    height: { type: number }
    quality: { type: string }

nodes:
  build_prompt:
    type: prompt-builder
    user_inputs:
      prompt: "${input.prompt}"
      style: "${input.mascot_style}"
    config:
      useCase: "brand-mascot"

  generate_mascots:
    type: image-generation
    depends_on: [build_prompt]
    inputs:
      prompt: "${build_prompt.output.finalPrompt}"
      count: "${input.count}"
      model: "${input.model}"
      aspect_ratio: "${input.aspect_ratio}"
      ratio: "${input.ratio}"
      width: "${input.width}"
      height: "${input.height}"
      quality: "${input.quality}"
    config:
      model: "flux-pro"

outputs:
  mascots: "${generate_mascots.output.assets}"

id: camera/dolly
label: Dolly Zoom (Vertigo Effect)
category: camera
media_types: [video]
prompt_instruction: |
  Apply a cinematic dolly zoom (Vertigo / Hitchcock zoom) camera movement:
  - Camera physically tracks forward while the focal length zooms out simultaneously
  - Subject remains the same apparent size in frame while the background changes dramatically
  - Background appears to stretch, grow, or compress — creating psychological tension
  - Apply slow, deliberate pacing for maximum dramatic emotional impact
  - Motion must be smooth and continuous with no frame stutter

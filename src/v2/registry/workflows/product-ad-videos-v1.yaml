id: product-ad-videos-v1
name: Product Ad Videos
version: 1.0.0
description: Generate high-converting cinematic product ad video clips

metadata:
  category: advertising
  tags: [product, ads, video]
  author: system

input_schema:
  required: [prompt]
  properties:
    prompt: { type: string }
    duration: { type: number }

nodes:
  build_prompt:
    type: prompt-builder
    user_inputs:
      prompt: "${input.prompt}"

  generate_video:
    type: video-generation
    depends_on: [build_prompt]
    inputs:
      prompt: "${build_prompt.output.finalPrompt}"
      duration: "${input.duration}"
    config:
      fps: 24
      model: "runway-gen3"

outputs:
  ad_video: "${generate_video.output.asset}"

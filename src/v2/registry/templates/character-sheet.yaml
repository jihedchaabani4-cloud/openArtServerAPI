id: character-sheet
label: Character Reference Sheet
sections:
  - name: "Front View"
    instruction: "Full-body front-facing view of the character. Clear visibility of face, clothing details, and full proportions. Relaxed natural standing pose. Entire body from head to feet visible."
    order: 1
  - name: "Back View"
    instruction: "Full-body rear view of the character. Show back of clothing, hair, and any details only visible from behind."
    order: 2
  - name: "Close-up Face Detail"
    instruction: "High-detail close-up portrait focusing on the head and face details, showing facial features, hair structure, and expressions clearly."
    order: 3

id: llm/translate
version: 2.0.0
applies_to: [llm]
category: language
priority: 20
description: Professional multi-lingual & Tunisian Derja translation for AI image generation, preserving all entity tags, character names, and reference tokens intact while converting visual meaning to pro English.

prompt_instruction: |
  PROFESSIONAL IMAGE PROMPT TRANSLATION & PRESERVATION DIRECTIVE:

  1. DIALECT & MULTI-LINGUAL CONTEXTUAL UNDERSTANDING:
  - Fluently understand and interpret Tunisian Derja (mixed Arabic-French-English-slang), Standard Arabic, French, Italian, Spanish, or any non-English language.
  - Translate the TRUE VISUAL MEANING into natural, highly descriptive, professional English suitable for state-of-the-art AI image generation models (Midjourney, Flux, SDXL).
  - Understand colloquial terms and clothing/lighting/environment slang (e.g. "labes", "9a3ed", "ch3ar", "dhow", "zen9a", "serwel", "vesta", "mraya", etc.) and convert them into accurate visual English descriptors.

  2. ABSOLUTE PRESERVATION OF TAGS, PROPER NAMES & REFERENCES:
  - NEVER alter, translate, delete, or reformat any reference tags or tokens.
  - Keep all tags in their exact syntactic position:
    * Character & Element Tags: `<character:UUID>`, `<element:UUID>`, `<MediaAsset:UUID>`, `<media:UUID>`, `<ref:UUID>`
    * Mention Tags: `@CharacterName`, `@ElementName`, `@image1`, `@image2`, `@imageN`
    * Masking Tokens: `__TAG_0__`, `__REF_0__`, `__TAG_1__`
  - Proper Names and Brand Names (e.g. Sarah, Elena, Goku, Nike, Cyberpunk) must remain untouched.

  3. PRO VISUAL TRANSLATION (NOT LITERAL WORD-BY-WORD):
  - Do NOT translate literally word-by-word if it creates awkward English. Translate the visual scene vividly.
  - Keep the prompt focused and faithful to the user's intent — do NOT hallucinate unrelated story elements.
  - Output ONLY the clean translated English prompt text, with no explanations, conversational filler, or introductory notes.

  4. FEW-SHOT EXAMPLES:
  - Input: "طفلة شعرها أسود قصير لابسة <element:cba62775-1b30> واقفة في زنقة في تونس العتيقة وقت الغروب"
    Output: "A young woman with short black hair wearing <element:cba62775-1b30>, standing in a narrow alleyway of the historic Tunis medina during golden hour sunset"
  - Input: "@Female Asian Elf 9a3da fi 9ahwa futuriste techreb fi 9ahwa b style cyberpunk"
    Output: "@Female Asian Elf sitting in a futuristic cyber cafe, sipping coffee, cyberpunk aesthetic"
  - Input: "rajel kbir b le7ya baydha labes <element:9df03afa> w dhow mta3 rim light 3al jnab"
    Output: "An elderly man with a white beard wearing <element:9df03afa>, with subtle rim lighting illuminating the side of his silhouette"

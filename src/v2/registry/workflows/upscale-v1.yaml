id: upscale-v1
name: Image Upscale
version: 1.0.0
description: Upscale and enhance image resolution with AI super-resolution.

metadata:
  category: image
  tags: [image, upscale, enhance, resolution]
  author: system

input_schema:
  required: [source_url]
  properties:
    source_url: { type: string }
    workflow_id: { type: string }
    project_id: { type: string }
    factor: { type: number }

nodes:
  upscale:
    type: upscale
    inputs:
      image: "${input.source_url}"
      workflow_id: "${input.workflow_id}"
      project_id: "${input.project_id}"
      factor: "${input.factor}"
    persist:
      target: media
      step_id: upscale
      status: completed
      value: "$outputs.assets[0].url"

outputs:
  main_asset: "${upscale.output.assets}"
  model_used: "${upscale.output.metadata.model}"

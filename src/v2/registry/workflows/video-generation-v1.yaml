id: video-generation-v1
name: Video Generation
version: 1.0.0
description: Direct video generation from a text prompt with optional reference images.

metadata:
  category: video
  tags: [video, generation, text-to-video]
  author: system

input_schema:
  required: [prompt]
  properties:
    prompt: { type: string }
    references: { type: array }
    workflow_id: { type: string }
    project_id: { type: string }
    ratio: { type: string }
    duration: { type: number }

nodes:
  build_prompt:
    type: prompt-builder
    inputs:
      prompt: "${input.prompt}"
      references: "${input.references}"

  generate:
    type: video-generation
    depends_on: [build_prompt]
    inputs:
      prompt: "${build_prompt.output.finalPrompt}"
      references: "${build_prompt.output.context.references}"
      workflow_id: "${input.workflow_id}"
      project_id: "${input.project_id}"
      ratio: "${input.ratio}"
      duration: "${input.duration}"
    persist:
      target: media
      step_id: video_generation
      status: completed
      value: "$outputs.assets[0].url"

outputs:
  main_asset: "${generate.output.assets}"
  model_used: "${generate.output.metadata.model}"

id: character-sheet
version: 1.2.0
applies_to: [prompt-builder]
description: Professional 3-panel studio character reference sheet without text/labels (Front View, Back View, Face Close-up Portrait).

parameters_schema:
  views:
    type: array
    default: [full-body front view, full-body back view, extreme face close-up portrait]
  style:
    type: string
    default: studio-photography
  background:
    type: string
    default: neutral studio gray background
  negative_prompt:
    type: string
    default: "no text, no labels, no typography, no written words, no watermarks, no badges, no overlay titles, no panel numbers"

pipeline:
  - resolveCharacters
  - resolveReferences
  - applyStudioSheetLayout
  - applyPhotographicDetails
  - enforceCleanNoTextConstraint
  - enhancePrompt

id: cinematic-video-v1
name: Cinematic Video
version: 1.0.0
description: Generate a cinematic video clip with upscale.

metadata:
  category: video
  tags: [video, cinematic, upscale]
  author: system

input_schema:
  required: [prompt]
  properties:
    prompt: { type: string }
    characters: { type: array }
    references: { type: array }
    style: { type: string }

nodes:
  build_prompt:
    type: prompt-builder
    user_inputs:
      prompt: "${input.prompt}"
      characters: "${input.characters}"
      references: "${input.references}"
      style: "${input.style}"
    config:
      skills: [storyboard]
      skill_parameters:
        panel_count: 1
        aspect_ratio: "16:9"

  generate_video:
    type: video-generation
    depends_on: [build_prompt]
    inputs:
      prompt: "${build_prompt.output.finalPrompt}"
      references: "${build_prompt.output.context.references}"
    config:
      duration: 5
      fps: 24

  upscale_video:
    type: upscale
    depends_on: [generate_video]
    inputs:
      asset: "${generate_video.output.asset}"
    config:
      factor: 2

outputs:
  main_asset: "${upscale_video.output.enhancedAsset}"

prompt-builder:
  skill_aware: true
  inputs:
    prompt: { type: string, required: true }
    references: { type: array, default: [] }
    characters: { type: array, default: [] }
    style: { type: string }
    source_asset: { type: object }           # ← NEW: for edit workflows
  outputs:
    finalPrompt: { type: string }
    context: { type: WorkflowContext }
  retry:
    max_attempts: 1
    backoff: none


image-generation:
  skill_aware: false
  inputs:
    prompt: { type: string, required: true }
    references: { type: array, default: [] }
    width: { type: number, default: 1024 }
    height: { type: number, default: 1024 }
    count: { type: number, default: 1 }
    seed: { type: number }
    model: { type: string }
  outputs:
    assets: { type: array }
    metadata: { type: object }
  retry:
    max_attempts: 2
    backoff: linear
    fallback_provider: fal

video-generation:
  skill_aware: false
  inputs:
    prompt: { type: string, required: true }
    startFrame: { type: object }
    references: { type: array, default: [] }
    duration: { type: number, default: 5 }
    fps: { type: number, default: 24 }
  outputs:
    asset: { type: object }
    metadata: { type: object }
  retry:
    max_attempts: 3
    backoff: exponential
    fallback_provider: runway

upscale:
  skill_aware: false
  inputs:
    asset: { type: object, required: true }
    factor: { type: number, default: 2 }
  outputs:
    enhancedAsset: { type: object }
  retry:
    max_attempts: 2
    backoff: linear

media-transform:
  skill_aware: false
  inputs:
    prompt: { type: string, required: true }
    source_asset: { type: object, required: true }   # ← image/video à modifier
    references: { type: array, default: [] }
    mode: { type: string, required: true }            # image_edit | video_to_video | image_variation | image_to_image
    model: { type: string }
    strength: { type: number, default: 0.75 }
    width: { type: number }
    height: { type: number }
  outputs:
    asset: { type: object }
    metadata: { type: object }
  retry:
    max_attempts: 2
    backoff: linear
    fallback_provider: fal

llm:
  skill_aware: true
  inputs:
    skills: { type: array, required: true }
    userPrompt: { type: string, required: true }
    images: { type: array, default: [] }
    model: { type: string }
    temperature: { type: number, default: 0.7 }
    jsonMode: { type: boolean, default: false }
    schema: { type: object }
    parameters: { type: object, default: {} }
    systemPromptOverride: { type: string }
  outputs:
    text: { type: string }
    json: { type: object }
    usage: { type: object }
    model: { type: string }
    provider: { type: string }
    skillsUsed: { type: array }
  retry:
    max_attempts: 2
    backoff: linear

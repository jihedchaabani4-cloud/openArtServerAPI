id: storyboard-v1
name: Storyboard
version: 1.0.0
description: Generate a multi-panel storyboard from a scene description.

metadata:
  category: storyboard
  tags: [storyboard, panels, cinematic]
  author: system

input_schema:
  required: [prompt]
  properties:
    prompt: { type: string }
    characters: { type: array }
    references: { type: array }
    style: { type: string }

nodes:
  build_prompt:
    type: prompt-builder
    user_inputs:
      prompt: "${input.prompt}"
      characters: "${input.characters}"
      references: "${input.references}"
      style: "${input.style}"
    config:
      skills: [storyboard]
      skill_parameters:
        panel_count: 6
        aspect_ratio: "16:9"

  generate:
    type: image-generation
    depends_on: [build_prompt]
    inputs:
      prompt: "${build_prompt.output.finalPrompt}"
      references: "${build_prompt.output.context.references}"
    config:
      width: 1920
      height: 1080
      count: 6

outputs:
  main_asset: "${generate.output.assets}"

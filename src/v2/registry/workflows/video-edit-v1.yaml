id: video-edit-v1
name: Video Edit
version: 1.0.0
description: Edit or restyle an existing video using a text prompt.

metadata:
  category: video
  tags: [video, edit, restyle]
  author: system

input_schema:
  required: [prompt, source_url]
  properties:
    prompt: { type: string }
    source_url: { type: string }
    workflow_id: { type: string }
    project_id: { type: string }

nodes:
  build_prompt:
    type: prompt-builder
    inputs:
      prompt: "${input.prompt}"
      source_url: "${input.source_url}"

  generate:
    type: video-generation
    depends_on: [build_prompt]
    inputs:
      prompt: "${build_prompt.output.finalPrompt}"
      video: "${input.source_url}"
      workflow_id: "${input.workflow_id}"
      project_id: "${input.project_id}"
    config:
      mode: edit
    persist:
      target: media
      step_id: video_edit
      status: completed
      value: "$outputs.assets[0].url"

outputs:
  main_asset: "${generate.output.assets}"
  model_used: "${generate.output.metadata.model}"

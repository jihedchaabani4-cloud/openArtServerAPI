id: element-sheet-builder
version: 1.0.0
applies_to: [prompt-builder]
description: Multi-view product/object/prop element reference sheet generator.

parameters_schema:
  views:
    type: array
    default: [front, side, back]
  style:
    type: string
    default: realistic

pipeline:
  - resolveReferences
  - moderationSafety
  - applyCharacterTemplate
  - applySheetLayout
  - enhancePrompt
  - generateNegativePrompt

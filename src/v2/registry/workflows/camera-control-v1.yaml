id: camera-control-v1
name: Camera Control
version: 1.0.0
description: Generate an image with precise camera angle, lens, and shot-type control.

metadata:
  category: image
  tags: [image, camera, cinematic, angle]
  author: system

input_schema:
  required: [prompt]
  properties:
    prompt: { type: string }
    references: { type: array }
    workflow_id: { type: string }
    project_id: { type: string }
    camera_angle: { type: string }
    shot_type: { type: string }
    lens: { type: string }
    ratio: { type: string }

nodes:
  build_prompt:
    type: prompt-builder
    inputs:
      prompt: "${input.prompt}"
      references: "${input.references}"
      camera_angle: "${input.camera_angle}"
      shot_type: "${input.shot_type}"
      lens: "${input.lens}"

  generate:
    type: image-generation
    depends_on: [build_prompt]
    inputs:
      prompt: "${build_prompt.output.finalPrompt}"
      references: "${build_prompt.output.context.references}"
      workflow_id: "${input.workflow_id}"
      project_id: "${input.project_id}"
      ratio: "${input.ratio}"
    config:
      count: 1
    persist:
      target: media
      step_id: camera_control
      status: completed
      value: "$outputs.assets[0].url"

outputs:
  main_asset: "${generate.output.assets}"
  model_used: "${generate.output.metadata.model}"

id: edit-image-v1
version: "1.0.0"
description: Edit an existing image using AI transformation
metadata:
  storage_behavior: version
  default_model: flux-kontext

input_schema:
  required: [prompt, source_asset]
  properties:
    prompt: { type: string }
    source_asset: { type: object }   # { id, url, type, width, height }
    style: { type: string }
    references: { type: array }
    model: { type: string }
    strength: { type: number }

nodes:
  build_prompt:
    type: prompt-builder
    user_inputs:
      prompt: "${input.prompt}"
      source_asset: "${input.source_asset}"
      references: "${input.references}"
      style: "${input.style}"

  transform:
    type: media-transform
    depends_on: [build_prompt]
    inputs:
      prompt: "${build_prompt.output.finalPrompt}"
      source_asset: "${input.source_asset}"
      references: "${build_prompt.output.context.references}"
      mode: image_edit
      model: "${input.model}"
      strength: "${input.strength}"
    config:
      width: 1024
      height: 1024

outputs:
  main_asset: "${transform.output.asset}"
  edit_context: "${build_prompt.output.context.edit_context}"

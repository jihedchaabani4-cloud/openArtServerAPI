id: layout/pose-sheet
label: Pose Sheet Layout
category: layout
media_types: [image]
prompt_instruction: |
  Format the output as a professional 3-panel character reference sheet layout:
  - Three side-by-side panels: Front View (left), Back View (middle), and Close-up Face Detail (right)
  - Clean neutral light grey or off-white background across all panels
  - Front and back views show full body from head-to-toe with consistent height and proportions
  - Right panel shows a detailed close-up portrait of the face and head details
  - Professional concept art presentation quality throughout
